<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>SLogic Firmware Update</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- stamp:begin (python3 stamp.py) -->
  <link rel="stylesheet" href="style.css?v=d9f1fc143f" />
  <script type="importmap">
  {
    "imports": {
      "./src/app.js": "./src/app.js?v=137003500a",
      "./src/batch-engine.js": "./src/batch-engine.js?v=88144eb621",
      "./src/batch.js": "./src/batch.js?v=3fd628ac70",
      "./src/demo.js": "./src/demo.js?v=6256dd7941",
      "./src/devices.js": "./src/devices.js?v=b0570fff1a",
      "./src/flash.js": "./src/flash.js?v=630ea83707",
      "./src/i18n.js": "./src/i18n.js?v=56431c68dd",
      "./src/led.js": "./src/led.js?v=f2646e4ce3",
      "./src/spi.js": "./src/spi.js?v=9cc90ac276",
      "./src/station.js": "./src/station.js?v=37ceee433b",
      "./src/updater.js": "./src/updater.js?v=41e6a2a7e5",
      "./src/usb.js": "./src/usb.js?v=9a0263bf85"
    }
  }
  </script>
  <!-- stamp:end -->
  <script>
    // Apply the saved theme before first paint (no flash of the wrong theme).
    try {
      const t = localStorage.getItem('slogic-ota-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8" />
        <path d="M6 21h4v-10h4v10h4v-10h4v10h4" />
      </svg>
      <div>
        <h1 data-i18n="title">SLogic Firmware Update</h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
    </div>
    <div class="top-actions">
      <a id="nav" class="button ghost nav-link" href="batch.html" data-i18n="navBatch"></a>
      <button id="lang" class="ghost" type="button"></button>
      <button id="theme" class="ghost icon" type="button" data-i18n-title="themeToggle">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="banner" class="banner" hidden>
      <strong id="banner-title"></strong>
      <span id="banner-body"></span>
    </div>

    <!-- 1. Device -->
    <section class="card" id="card-device">
      <div class="card-head"><span class="num">1</span><h2 data-i18n="step1"></h2></div>
      <div id="device-empty" class="empty">
        <p data-i18n="connectHint"></p>
        <button id="connect" class="primary" type="button" data-i18n="connect"></button>
      </div>
      <div id="device-info" class="device" hidden>
        <div class="device-main">
          <div class="device-name" id="device-name"></div>
          <span id="device-mode" class="pill"></span>
        </div>
        <dl class="facts">
          <div><dt data-i18n="ledTitle"></dt><dd id="device-led" class="led-text"></dd></div>
          <div id="device-serial-row"><dt data-i18n="serial"></dt><dd id="device-serial" class="mono"></dd></div>
          <div><dt>USB</dt><dd id="device-usb" class="mono"></dd></div>
        </dl>
        <p id="device-note" class="note" hidden></p>
        <button id="change" class="ghost small" type="button" data-i18n="change"></button>
      </div>
      <p id="device-error" class="error-text" hidden></p>
      <details class="help" id="help">
        <summary data-i18n="helpTitle"></summary>
        <ul>
          <li data-i18n="helpCable"></li>
          <li data-i18n="helpApps"></li>
          <li data-i18n="helpWindows"></li>
          <li><span data-i18n="helpLinux"></span><pre id="udev-cmd"></pre></li>
          <li data-i18n="helpMac"></li>
        </ul>
      </details>
    </section>

    <!-- 2. Firmware -->
    <section class="card" id="card-file">
      <div class="card-head"><span class="num">2</span><h2 data-i18n="step2"></h2></div>
      <label id="drop" class="drop">
        <input id="file" type="file" accept=".bin,application/octet-stream" hidden />
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>
        <span data-i18n="fileHint"></span>
        <span class="button ghost small" data-i18n="chooseFile"></span>
      </label>
      <div id="file-info" class="file" hidden>
        <div class="file-name" id="file-name"></div>
        <dl class="facts">
          <div><dt data-i18n="size"></dt><dd id="file-size"></dd></div>
          <div class="wide"><dt data-i18n="sha256"></dt>
            <dd class="hash"><code id="file-hash"></code><button id="copy-hash" class="link" type="button" data-i18n="copy"></button></dd></div>
        </dl>
        <ul id="file-warnings" class="warnings" hidden></ul>
        <label id="ack-row" class="ack" hidden><input id="ack" type="checkbox" /> <span id="ack-text"></span></label>
        <button id="file-change" class="ghost small" type="button" data-i18n="change"></button>
      </div>
    </section>

    <!-- 3. Update -->
    <section class="card" id="card-update">
      <div class="card-head"><span class="num">3</span><h2 data-i18n="step3"></h2></div>
      <p id="ready" class="muted"></p>
      <div class="actions">
        <button id="start" class="primary large" type="button" data-i18n="start" disabled></button>
        <button id="cancel" class="ghost" type="button" data-i18n="cancel" hidden></button>
      </div>
      <p id="keep" class="note" data-i18n="keepConnected" hidden></p>

      <ol id="steps" class="steps" hidden></ol>

      <div id="progress" class="progress" hidden>
        <div class="bar"><div id="bar-fill"></div></div>
        <div class="progress-meta"><span id="progress-label"></span><span id="progress-eta"></span></div>
      </div>

      <div id="gesture" class="callout" hidden>
        <strong id="gesture-title"></strong>
        <p id="gesture-body"></p>
        <button id="gesture-btn" class="primary" type="button" data-i18n="gButton"></button>
      </div>

      <div id="result" class="result" hidden>
        <div class="result-icon" aria-hidden="true"></div>
        <div>
          <strong id="result-title"></strong>
          <p id="result-body"></p>
          <button id="result-btn" class="ghost small" type="button"></button>
        </div>
      </div>

      <details id="log-box" class="log" hidden>
        <summary><span data-i18n="log"></span><button id="copy-log" class="link" type="button" data-i18n="copyLog"></button></summary>
        <pre id="log"></pre>
      </details>
    </section>
  </main>

  <footer>
    <span data-i18n="footer"></span><a id="wiki" target="_blank" rel="noopener" data-i18n="wiki"></a>
  </footer>

  <script type="module">import "./src/app.js";</script>
</body>
</html>
