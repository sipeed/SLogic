# Component declarations: shared libraries and user-facing products.
# `source` names a checkout under sources/; `targets` lists supported targets.

[libsigrok]
kind = "library"
source = "libsigrok"
dependencies = []
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

[libsigrokdecode]
kind = "library"
source = "libsigrokdecode"
dependencies = []
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

[pulseview]
kind = "product"
source = "pulseview"
dependencies = ["libsigrok", "libsigrokdecode"]
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

[slogicview]
kind = "product"
source = "slogicview"
dependencies = ["libsigrok", "libsigrokdecode"]
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

[sigrok-cli]
kind = "product"
source = "sigrok-cli"
dependencies = ["libsigrok", "libsigrokdecode"]
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

# Multi-vendor DSView fork; self-contained (bundles its own libsigrok4DSL
# and libsigrokdecode4DSL). Not in any target's default_products yet: build
# it explicitly with --product all-logic.
[all-logic]
kind = "product"
source = "all-logic"
dependencies = []
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

# Rust bridge server (twinlan protocol). Self-contained: its libsigrok-sys
# crate builds its own static libsigrok + C deps, so dependencies = []. Only
# the glibc Linux target and macOS (Vulkan/glibc-validated; Windows deferred).
[sigrok-bridge]
kind = "product"
source = "sigrok-bridge"
dependencies = []
targets = ["linux-x86_64-glibc", "macos-arm64"]

# ngscopeclient (scopehal-apps GUI). The superproject records pure-upstream
# scopehal-apps; its `lib` submodule (the scopehal fork carrying the SLogic
# driver) is supplied from the repo's own `sources/scopehal` submodule and
# overlaid onto `lib` at build time by each target driver. override_submodule
# marks `lib` as build-overridden so the clean-check ignores its dirtiness; the
# fork's pin is the sources/scopehal gitlink. See build/common/ngscopeclient-lib.env.
[ngscopeclient]
kind = "product"
source = "ngscopeclient"
dependencies = []
targets = ["linux-x86_64-glibc", "macos-arm64"]
override_submodule = "lib"
