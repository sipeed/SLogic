# Component declarations: shared libraries and user-facing products.
# `source` names a checkout under sources/; `targets` lists supported targets.

[libsigrok]
kind = "library"
source = "libsigrok"
dependencies = []
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

[libsigrokdecode]
kind = "library"
source = "libsigrokdecode"
dependencies = []
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

[pulseview]
kind = "product"
source = "pulseview"
dependencies = ["libsigrok", "libsigrokdecode"]
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

[slogicview]
kind = "product"
source = "slogicview"
dependencies = ["libsigrok", "libsigrokdecode"]
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

[sigrok-cli]
kind = "product"
source = "sigrok-cli"
dependencies = ["libsigrok", "libsigrokdecode"]
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

# Multi-vendor DSView fork; self-contained (bundles its own libsigrok4DSL
# and libsigrokdecode4DSL). Not in any target's default_products yet: build
# it explicitly with --product all-logic.
[all-logic]
kind = "product"
source = "all-logic"
dependencies = []
targets = ["linux-x86_64-musl", "windows-x86_64-ucrt", "macos-arm64"]

# Rust bridge server (twinlan protocol). Self-contained: its libsigrok-sys
# crate builds its own static libsigrok + C deps, so dependencies = []. Only
# the glibc Linux target and macOS (Vulkan/glibc-validated; Windows deferred).
[sigrok-bridge]
kind = "product"
source = "sigrok-bridge"
dependencies = []
targets = ["linux-x86_64-glibc", "macos-arm64"]

# ngscopeclient (scopehal-apps GUI). Self-contained: bundles its own scopehal
# fork via the `lib` submodule. The superproject records pure-upstream
# scopehal-apps; the fork is applied as a build-time submodule override (the
# override_* keys below), never committed. See build/common/ngscopeclient-lib.env.
[ngscopeclient]
kind = "product"
source = "ngscopeclient"
dependencies = []
targets = ["linux-x86_64-glibc", "macos-arm64"]
override_submodule = "lib"
override_url = "https://github.com/sipeed/scopehal.git"
override_branch = "feat/SLogic"
override_commit = "046a8c13"
