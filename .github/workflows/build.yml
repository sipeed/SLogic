name: build

# Builds every product for all three targets.
#   linux-x86_64-musl  + windows-x86_64-ucrt : container builds (Docker /
#     Wine-in-Docker), run on a Linux runner.
#   macos-arm64                              : native build on an Apple Silicon
#     runner, code-signed + notarized.
#
# The build environments (slogic/buildenv-*) are built from the Dockerfiles in
# build/environments/ on first use by ensure-environment; caching them to a
# registry (ghcr.io) or via buildx layer cache is a worthwhile follow-up.

on:
  workflow_dispatch:
    inputs:
      products:
        description: Comma-separated products (legacy sigrok/Qt targets)
        default: pulseview,slogicview,sigrok-cli,all-logic
      ngscope:
        description: Also build ngscopeclient + sigrok-bridge (slow; Vulkan/Rust)
        type: boolean
        default: false
      macos_only:
        description: Build only the macOS target (skip Linux musl/glibc + Windows)
        type: boolean
        default: false
      ngscope_only:
        description: macOS only — build just ngscopeclient + sigrok-bridge (skip the Qt GUIs)
        type: boolean
        default: false
  push:
    tags:
      - 'release-*'

permissions:
  contents: read

env:
  PRODUCTS: ${{ github.event.inputs.products || 'pulseview,slogicview,sigrok-cli,all-logic' }}
  # ngscopeclient + sigrok-bridge are slow (Vulkan C++, Rust building libsigrok
  # from source): opt in via the dispatch flag, and always on a release tag.
  NGSCOPE: ${{ github.event_name == 'push' || github.event.inputs.ngscope == 'true' }}

jobs:
  container-targets:
    if: ${{ github.event.inputs.macos_only != 'true' && github.event.inputs.ngscope_only != 'true' }}
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64-musl
            env: linux-alpine-3.22
            products: pulseview,slogicview,sigrok-cli,all-logic
            extra: ''
          # Wine spawns a process per moc/compiler invocation; the all-logic
          # (DSView) build runs autotools + cmake concurrently and overruns the
          # Wine process table at very high parallelism, so keep it modest.
          - target: windows-x86_64-ucrt
            env: windows-msys2-ucrt64
            products: pulseview,slogicview,sigrok-cli,all-logic
            extra: '--jobs 3'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # the build derives its version from git history

      # Persist the buildenv image as a tarball keyed on the environment's
      # contents (the Dockerfile), so the ~30 min toolchain rebuild is skipped
      # on every run. actions/cache is more reliable than buildx type=gha, which
      # did not persist across runs here.
      - name: Cache buildenv image
        uses: actions/cache@v4
        with:
          path: /tmp/buildenv-${{ matrix.env }}.tar
          key: buildenv-${{ matrix.env }}-${{ hashFiles(format('build/environments/{0}/**', matrix.env)) }}

      - name: Load or build build environment
        run: |
          TAR="/tmp/buildenv-${{ matrix.env }}.tar"
          if [ -f "$TAR" ]; then
            echo "buildenv cache hit -> docker load"
            docker load -i "$TAR"
          else
            echo "buildenv cache miss -> building image"
            IMG=$(python3 build/scripts/ensure-environment "${{ matrix.env }}")
            docker save "$IMG" -o "$TAR"
          fi

      - name: Build ${{ matrix.target }}
        run: |
          python3 build/scripts/build \
            --target "${{ matrix.target }}" \
            --product "${{ matrix.products }}" ${{ matrix.extra }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifact/**
          if-no-files-found: error
          retention-days: 7

  # ngscopeclient (Vulkan GUI) + sigrok-bridge (Rust) on a glibc Debian
  # container — they are glibc-validated and do not build on the musl target.
  # Opt-in (NGSCOPE) because the Vulkan C++ and from-source Rust builds are slow.
  glibc-target:
    name: linux-x86_64-glibc
    if: ${{ (github.event_name == 'push' || github.event.inputs.ngscope == 'true') && github.event.inputs.macos_only != 'true' && github.event.inputs.ngscope_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache buildenv image
        uses: actions/cache@v4
        with:
          path: /tmp/buildenv-linux-glibc.tar
          key: buildenv-linux-glibc-${{ hashFiles('build/environments/linux-glibc/**') }}

      - name: Load or build build environment
        run: |
          TAR="/tmp/buildenv-linux-glibc.tar"
          if [ -f "$TAR" ]; then
            echo "buildenv cache hit -> docker load"
            docker load -i "$TAR"
          else
            echo "buildenv cache miss -> building image"
            IMG=$(python3 build/scripts/ensure-environment linux-glibc)
            docker save "$IMG" -o "$TAR"
          fi

      # cargo registry/git + libsigrok-sys tarballs + ccache persist between runs
      # (the from-source C build for libsigrok-sys is heavy).
      - name: Cache build caches
        uses: actions/cache@v4
        with:
          path: |
            build/out/cache/cargo
            build/out/cache/libsigrok-sys
            build/out/cache/ccache/linux-x86_64-glibc
          key: glibc-caches-${{ hashFiles('sources/sigrok-bridge/Cargo.lock', 'build/environments/linux-glibc/**') }}
          restore-keys: |
            glibc-caches-

      - name: Build linux-x86_64-glibc
        run: |
          python3 build/scripts/build \
            --target linux-x86_64-glibc \
            --product sigrok-bridge,ngscopeclient

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-glibc
          path: artifact/**
          if-no-files-found: error
          retention-days: 7

  macos-target:
    name: macos-arm64
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # build-native bundles dylibs with dylibbundler (macdeployqt handles Qt).
      # molten-vk supplies the runtime Vulkan ICD bundled into the ngscopeclient
      # .app (only needed when NGSCOPE is on, but harmless otherwise).
      # rust -> cargo for sigrok-bridge's libsigrok-sys: build-native resets PATH to
      # $PREFIX/bin:/opt/homebrew/bin:... which drops rustup's ~/.cargo/bin, so brew's
      # cargo (in /opt/homebrew/bin, on that PATH) is what it finds. meson is NOT from
      # brew here: brew meson runs under its own venv python that lacks the `packaging`
      # module glib2's meson build requires. It is installed into the conda prefix
      # instead (next step) so it runs under the prefix python, which has packaging.
      # ngscopeclient's own deps (glfw/glslang/shaderc/spirv-tools/vulkan-*/yaml-cpp/
      # libomp/catch2) are NOT in the conda-lock (which only covers the Qt trio), so
      # they come from Homebrew and build-native points ngscopeclient's CMake at
      # /opt/homebrew. On this macos-14 runner brew bottles are minOS<=14, which
      # passes the bundle's 15.0 deployment-target check.
      - name: Install packaging + toolchain
        run: |
          brew install dylibbundler molten-vk rust \
            glfw glslang shaderc spirv-tools vulkan-headers vulkan-loader \
            yaml-cpp libomp catch2 hidapi

      # --- dependency prefix ---------------------------------------------------
      # build-native needs SLOGIC_MACOS_PREFIX pointing at a conda prefix holding
      # the deps (Qt6, glib, boost, python, fftw, libusb, libzip, ...). It is
      # recreated exactly from the committed conda-lock (an @EXPLICIT list of
      # conda-forge URLs with md5) and built with MACOSX_DEPLOYMENT_TARGET=15.0.
      # Homebrew does NOT work (its bottles target the host macOS and fail the
      # deployment-target check). The prefix is ~1.5 GB, so it is cached.
      - name: Cache dependency prefix
        id: prefix-cache
        uses: actions/cache@v4
        with:
          path: ~/macos15-env
          key: macos15-env-${{ hashFiles('build/environments/macos-xcode/conda-lock.txt') }}

      - name: Create dependency prefix
        if: steps.prefix-cache.outputs.cache-hit != 'true'
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/osx-arm64/latest \
            | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          "$RUNNER_TEMP/bin/micromamba" create -y -p "$HOME/macos15-env" \
            -f build/environments/macos-xcode/conda-lock.txt

      # meson is not pinned in conda-lock; add it to the prefix so it runs under the
      # prefix python (which has `packaging`, required by glib2's meson build). Runs
      # every time (idempotent) since the prefix may be a cache hit with no micromamba.
      - name: Add meson to the dependency prefix
        run: |
          MAMBA="$RUNNER_TEMP/bin/micromamba"
          if [ ! -x "$MAMBA" ]; then
            curl -Ls https://micro.mamba.pm/api/micromamba/osx-arm64/latest \
              | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          fi
          "$MAMBA" install -y -p "$HOME/macos15-env" -c conda-forge meson

      - name: Export prefix path
        run: echo "SLOGIC_MACOS_PREFIX=$HOME/macos15-env" >> "$GITHUB_ENV"

      # --- signing identity: Developer ID cert into a temporary keychain -------
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/slogic.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Make the temp keychain searchable alongside the login keychain.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/["]//g')

      # --- notary credentials: Apple ID + app-specific password -> keychain profile
      # (matches the build Mac's existing slogic-notary profile). The password is
      # an app-specific password from appleid.apple.com, NOT the Apple ID login. --
      - name: Store notary credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials slogic-notary \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID"

      - name: Build macos-arm64 (signed + notarized)
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
          # Not secret (Team IDs are public), but kept out of the file:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: slogic-notary
        run: |
          if [ "${{ github.event.inputs.ngscope_only }}" = true ]; then
            products="sigrok-bridge,ngscopeclient"
          else
            products="$PRODUCTS"
            if [ "$NGSCOPE" = true ]; then
              products="$products,sigrok-bridge,ngscopeclient"
            fi
          fi
          python3 build/scripts/build --target macos-arm64 --product "$products"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifact/**
          if-no-files-found: error
          retention-days: 7

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/slogic.keychain-db" || true

  # On a release-* tag, publish the built products as a GitHub Release: a
  # permanent, publicly downloadable version. Plain runs only keep the 7-day
  # artifacts above (which need a GitHub login to download).
  release:
    if: startsWith(github.ref, 'refs/tags/release-')
    needs: [container-targets, glibc-target, macos-target]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.AppImage
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
